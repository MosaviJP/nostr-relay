services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - "7447:7447"
    environment:
      DRIVER: postgresql
      DATABASE_URL: postgres://nostr:nostr@db:5432/nostr?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nostr
      POSTGRES_PASSWORD: nostr
      POSTGRES_DB: nostr
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nostr -d nostr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
