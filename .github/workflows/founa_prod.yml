# founa(换品牌新体系)prod 部署。MOS-3743 / 父工单 MOS-3737。
#
# 触发只挂 workflow_dispatch, 且必须填一个 image_tag —— prod 不构建镜像,
# 只部署 stage 验证过的那个 commit。stage 侧 founa_stage.yml 每次构建都会打
# <sha> 与 stage-latest 两个 tag, 这里填的就是那个 <sha>。
#
# 走 founa-prod Environment 的 required reviewer 审批(需在仓库 Settings 配)。
#
# 查询实例(relay-query)不在此 workflow 内: prod 不做自动串联, 两个实例各自
# 手动选版本部署, 见 founa_prod_query.yml。

name: deploy founa prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'ECR image tag(git sha, 要求镜像已在 founa-relay 上; 取 stage 验证过的那个 commit)'
        required: true
        type: string

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: founa-relay          # 三环境共用一个仓库,靠 tag 区分
  ECS_SERVICE: relay
  ECS_CLUSTER: founa-prod-ecs-cluster
  ECS_TASK_DEFINITION: ./deploy/founa-task-def-prod.json
  CONTAINER_NAME: relay
  TARGET_GROUP_NAME: founa-prod-relay-tg
  LOG_GROUP: /ecs/founa-prod/relay
  DESIRED_COUNT: 2
  SUBNETS: subnet-0950cc41950b8d6ef,subnet-0fafa7e8f05ed71d0,subnet-0eb1b0282891826a4
  SECURITY_GROUPS: sg-040288f511ff914bf

# OIDC 部署: 必须有 id-token: write, 否则拿不到 OIDC token。
permissions:
  id-token: write
  contents: read

concurrency:
  group: founa-prod-relay
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy founa prod
    runs-on: ubuntu-latest
    # 挂 Environment 是为了拿到 environment 级的 vars.AWS_ROLE,不是审批门。
    environment: founa-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHub-OIDC-founa-prod-relay

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 平台 linux/amd64:与 task-def 的 runtimePlatform X86_64 一致。
      # 不构建镜像: prod 只部署 stage 验证过的那个 commit。
      # tag 不存在说明该 commit 没在 stage 跑过, 直接拦下。
      - name: Verify image exists in ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${{ inputs.image_tag }}" \
            --query 'imageDetails[0].{Tag:imageTags,Pushed:imagePushedAt,Digest:imageDigest}' --output table
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ inputs.image_tag }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "::notice::image=${IMAGE}"

      # prod-latest 只是给人看的浮动指针, service 始终跑具体 sha。
      # 已指向同一 manifest 时 ECR 返回 ImageAlreadyExistsException, 属正常;
      # 其余错误(如权限不足)要让 workflow 失败, 不能一并吞掉。
      - name: Tag image as prod-latest
        run: |
          set -euo pipefail
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${{ inputs.image_tag }}" \
            --query 'images[0].imageManifest' --output text)
          if ERR=$(aws ecr put-image \
                     --repository-name "$ECR_REPOSITORY" \
                     --image-tag prod-latest \
                     --image-manifest "$MANIFEST" 2>&1 >/dev/null); then
            echo "prod-latest 已指向 ${{ inputs.image_tag }}"
          elif echo "$ERR" | grep -q 'ImageAlreadyExistsException'; then
            echo "prod-latest 本就指向该镜像, 跳过"
          else
            echo "$ERR" >&2
            exit 1
          fi

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Ensure infrastructure and deploy
        env:
          TASK_DEF_FILE: ${{ steps.task-def.outputs.task-definition }}
        run: |
          set -euo pipefail
          CONTAINER_PORT=7447

          # --- CloudWatch log group ---
          # 预建而非依赖 task-def 的 awslogs-create-group,
          # 这样 task execution role 不需要 logs:CreateLogGroup 权限。
          #
          # 直接 create 并靠 ResourceAlreadyExistsException 判断已存在, 不用 DescribeLogGroups:
          # 后者是 list 类 API, 评估的资源是 log-group::log-stream: (空名),
          # 无法用具体的 log group ARN 做资源限定, 只能 Resource:"*"。
          if ERR=$(aws logs create-log-group --log-group-name "$LOG_GROUP" 2>&1); then
            echo "创建 log group $LOG_GROUP"
          elif echo "$ERR" | grep -q 'ResourceAlreadyExistsException'; then
            echo "log group $LOG_GROUP 已存在"
          else
            echo "$ERR" >&2
            exit 1
          fi

          # --- target group ---
          # TG 与 ALB listener 均由 Terraform 统一创建, 本 workflow 只查询 ARN。
          if ! TG_ARN=$(aws elbv2 describe-target-groups --names "$TARGET_GROUP_NAME" \
                          --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null); then
            echo "target group $TARGET_GROUP_NAME 不存在。" >&2
            echo "它由 Terraform 统一创建, 请先在 Founa-Terraform 中建出" >&2
            echo "(alb_targets 加 relay = { alb_port = 8001, target_port = 7447 })。" >&2
            exit 1
          fi
          echo "TG_ARN=$TG_ARN"

          # ECS 不允许 service 绑定没有关联 load balancer 的 target group,
          # 这里提前拦一下, 好过让 CreateService 抛 InvalidParameterException。
          TG_LBS=$(aws elbv2 describe-target-groups --target-group-arns "$TG_ARN" \
            --query 'TargetGroups[0].LoadBalancerArns' --output text)
          if [ -z "$TG_LBS" ] || [ "$TG_LBS" = "None" ]; then
            echo "target group $TARGET_GROUP_NAME 尚未挂到任何 ALB listener 上。" >&2
            echo "ECS 要求 service 绑定的 TG 必须已关联 load balancer, 请先配置 8001 listener。" >&2
            exit 1
          fi

          # --- task definition ---
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$TASK_DEF_FILE" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "TASK_DEF_ARN=$TASK_DEF_ARN"

          # --- ECS service ---
          # 部署断路器必须显式开：不开的话任务起不来时 service scheduler 会【无限重试】
          # (每 30 秒一轮)，部署既不失败也不回滚，只能靠人去看事件。开了之后失败
          # 3 次(desiredCount=1 时的阈值)即判定部署失败并回滚到上一个稳定版本。
          # update 分支也传一次，这样存量 service 被手工关掉后能被下次部署纠正回来。
          STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].status' --output text 2>/dev/null || echo MISSING)

          if [ "$STATUS" = "ACTIVE" ]; then
            echo "service $ECS_SERVICE 已存在, 更新到新的 task definition"
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
              --task-definition "$TASK_DEF_ARN" \
              --deployment-configuration 'deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=100' >/dev/null
          else
            echo "service $ECS_SERVICE 不存在($STATUS), 创建"
            aws ecs create-service \
              --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" \
              --task-definition "$TASK_DEF_ARN" \
              --desired-count "$DESIRED_COUNT" \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
              --load-balancers "targetGroupArn=$TG_ARN,containerName=$CONTAINER_NAME,containerPort=$CONTAINER_PORT" \
              --health-check-grace-period-seconds 60 \
              --deployment-configuration 'deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=100' >/dev/null
          fi

          echo "等待 service 稳定"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
